name: Build Muse Number Two Windows Desktop App

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-windows-desktop:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: dual-muse-apk/desktop-electron
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dual-muse-apk/desktop-electron/package-lock.json
      - name: Install dependencies
        run: npm install
      - name: Build Windows installer and portable app
        run: npm run dist
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: muse-number-two-windows
          path: dual-muse-apk/desktop-electron/dist/*
          if-no-files-found: error
