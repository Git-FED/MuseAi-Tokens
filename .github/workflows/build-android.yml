name: Build Muse Number Two Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Find and build Android project
        shell: bash
        run: |
          set -euo pipefail
          project_dir="$(dirname "$(find . -type f -name gradlew -not -path '*/.gradle/*' -print -quit)")"
          test -n "$project_dir" && test -f "$project_dir/settings.gradle"
          echo "Android project: $project_dir"
          chmod +x "$project_dir/gradlew"
          (cd "$project_dir" && ./gradlew --no-daemon assembleDebug)
      - uses: actions/upload-artifact@v4
        with:
          name: muse-number-two-debug
          path: '**/app/build/outputs/apk/debug/app-debug.apk'
          if-no-files-found: error
