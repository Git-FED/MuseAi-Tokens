name: build-web2apk

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dual-muse-apk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: muse-number-two-debug
          path: dual-muse-apk/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
